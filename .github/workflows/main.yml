name: Build CCAster

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git perl fakeroot rsync build-essential \
            clang llvm libtinfo-dev libxml2-dev

      - name: Install Theos
        run: |
          sudo mkdir -p $THEOS
          sudo chown -R "$(whoami)" $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install ldid
        run: |
          sudo curl -L -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      # theos/theos (cloned above) only contains the makefiles/scripts.
      # The actual Linux cross clang/clang++ toolchain for the iphone target
      # ships separately from theos/theos-linux-toolchain and must be
      # extracted into $THEOS/toolchain/linux/iphone.
      - name: Install Theos Linux toolchain
        run: |
          TOOLCHAIN_URL=$(curl -s https://api.github.com/repos/theos/theos-linux-toolchain/releases/latest \
            | grep browser_download_url | grep 'linux-x86_64' | cut -d '"' -f 4)
          echo "Downloading $TOOLCHAIN_URL"
          curl -L -o /tmp/toolchain.tar.xz "$TOOLCHAIN_URL"
          mkdir -p $THEOS/toolchain/linux/iphone
          tar -xf /tmp/toolchain.tar.xz -C $THEOS/toolchain/linux/iphone --strip-components=1
          ls $THEOS/toolchain/linux/iphone/bin

      # CCAster targets iOS 16 (rootless), so we need an iOS 16.x SDK.
      # theos/sdks hosts prebuilt SDKs Theos can consume directly.
      - name: Install iOS 16.5 SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk $THEOS/sdks/
          ls $THEOS/sdks

      - name: Build package
        run: |
          export CLANG_MODULE_CACHE_PATH=/tmp/clang-module-cache
          export SWIFT_MODULE_CACHE_PATH=/tmp/swift-module-cache
          make clean package FINALPACKAGE=1

      - name: Locate built .deb
        id: find_deb
        run: |
          DEB_PATH=$(find packages -name "*.deb" | head -n 1)
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $DEB_PATH"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCAster-deb
          path: packages/*.deb
          if-no-files-found: error
