name: Build (Theos / rootless)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos toolchain + SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/theos
          key: theos-${{ runner.os }}-v1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm rsync fakeroot dpkg-dev

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Install iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p ~/theos/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk ~/theos/sdks/
          rm -rf /tmp/sdks

      - name: Install Linux -> iOS clang toolchain
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/theos/toolchain
          curl -sL -o /tmp/ios-toolchain.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          tar -xJf /tmp/ios-toolchain.tar.xz -C ~/theos/toolchain/
          rm -f /tmp/ios-toolchain.tar.xz

      - name: Build package
        env:
          THEOS: /home/runner/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Locate .deb
        id: find_deb
        run: |
          DEB_PATH=$(find packages -name "*.deb" | head -n 1)
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $DEB_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
          if-no-files-found: error
