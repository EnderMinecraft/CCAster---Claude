name: Build CCAster

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git perl fakeroot rsync build-essential \
            clang llvm libtinfo-dev libxml2-dev

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install ldid
        run: |
          sudo curl -L -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      # CCAster targets iOS 16 (rootless), so we need an iOS 16.x SDK.
      # theos/sdks hosts prebuilt SDKs Theos can consume directly.
      - name: Install iOS 16.5 SDK
        run: |
          sudo git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          sudo git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          sudo git checkout
          sudo mv iPhoneOS16.5.sdk $THEOS/sdks/
          ls $THEOS/sdks

      - name: Build package
        run: |
          export CLANG_MODULE_CACHE_PATH=/tmp/clang-module-cache
          export SWIFT_MODULE_CACHE_PATH=/tmp/swift-module-cache
          make clean package FINALPACKAGE=1

      - name: Locate built .deb
        id: find_deb
        run: |
          DEB_PATH=$(find packages -name "*.deb" | head -n 1)
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $DEB_PATH"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCAster-deb
          path: packages/*.deb
          if-no-files-found: error
